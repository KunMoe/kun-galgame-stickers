<!doctype html>
<html lang="%kun.lang%" class="%kun.htmlClass%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      ;(function () {
        try {
          var m = document.cookie.match(/(?:^|; )kun-sticker-theme=([^;]+)/)
          var theme = m ? decodeURIComponent(m[1]) : 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('kun-dark-mode', dark)
        } catch (e) {}
      })()
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
