# kun-galgame-sticker — PRODUCTION compose (Dokploy + GHCR).
#
# Downstream app: owns NO backing services. Joins the shared `dokploy-network`
# and reaches infra by service name (postgres:5432, oauth:9277). Bring infra up
# first.
#
# Traefik (Dokploy domains):
#   sticker.kungal.com            → web:3000
#   sticker.kungal.com/api        → sticker-api:9421   (PathPrefix /api, higher priority)
#
#   docker compose -f docker-compose.prod.yml up -d
# The `migrate` service runs automatically before sticker-api on every `up`
# (api depends_on it completing) — pending DB migrations are applied on each
# deploy, no manual migrate step. Idempotent + near-instant when nothing is
# pending; a failed migration blocks the API from starting (intended — never
# serve an un-migrated schema).
#
# Set in this app's Dokploy Environment:
#   POSTGRES_PASSWORD          — must match infra Postgres
#   KUN_OAUTH_CLIENT_SECRET    — the 鲲 Galgame 表情包 confidential client secret
#   KUN_CATALOG_API_KEY        — application key (nmk_live_…) scoped catalog:read,
#                                minted in the NextMoe developer portal
#   NUXT_OG_SITE_KEY           — nextmoe-og per-site signing key. Optional: with
#                                it unset, share images fall back to the artwork
#                                each page already has.
# A Dokploy variable only reaches a container if this file names it, which is
# why the key is written out in x-api-env below rather than merely existing in
# the panel. It is required (:?) rather than optional on purpose: an absent key
# does not break the site -- game and character linking simply turns itself off
# and logs a warning -- and a feature that silently disables itself on deploy is
# worth failing loudly for instead.
name: kun-galgame-sticker

x-svc-health: &svc-health
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

x-api-env: &api-env
  SERVER_PORT: '9421'
  SERVER_MODE: prod
  CORS_ALLOW_ORIGINS: https://sticker.kungal.com
  KUN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/kungalgame_sticker?sslmode=disable
  KUN_OAUTH_SERVER_URL: http://oauth:9277/api/v1
  KUN_OAUTH_WEB_URL: https://account.nextmoe.com
  KUN_OAUTH_CLIENT_ID: c5cd7b074804ba134934eb6c175a8f4d
  KUN_OAUTH_CLIENT_SECRET: ${KUN_OAUTH_CLIENT_SECRET:?set KUN_OAUTH_CLIENT_SECRET}
  KUN_OAUTH_REDIRECT_URI: https://sticker.kungal.com/auth/callback
  KUN_IMAGE_CLIENT_BASE_URL: http://image:9278
  KUN_IMAGE_CDN_BASE: https://image.kungal.iloveren.link
  # catalog over the shared network, like oauth and image above: no public DNS,
  # no TLS handshake and no Traefik hop on a call that happens per picker
  # keystroke. Only the secret comes from Dokploy.
  KUN_CATALOG_BASE_URL: http://catalog:9281
  KUN_CATALOG_API_KEY: ${KUN_CATALOG_API_KEY:?set KUN_CATALOG_API_KEY}
  # Pack comment threads. Same OAuth credentials as the image service; the
  # tenant is derived upstream from this client's catalog_site binding and is
  # never sent, so there is nothing else to configure here.
  KUN_COMMUNITY_BASE_URL: http://community:9282

services:
  # Unique name on dokploy-network (same reason kungal-api / moyu-api are not
  # just `api`): Dokploy registers the compose service name, not aliases.
  sticker-api:
    image: ghcr.io/kunmoe/sticker-api:latest
    pull_policy: always
    environment:
      <<: *api-env
    expose:
      - '9421'
    # The public developer-platform face (NextMoe doc 08 §16.5). These labels
    # are hand-written because they carry a middleware Dokploy's Domains panel
    # cannot express; the sticker.kungal.com routers beside them are still
    # Dokploy's own and are not repeated here.
    #
    # The gateway does the authenticating: forwardAuth asks oauth whether the
    # caller's nmk_ key is valid and within budget, and only then forwards. It
    # asks for no scope -- a free read-only face admits any valid key (infra
    # PR #168, 2026-09-08). Nothing strips the prefix, so the API serves
    # /v2/sticker/* verbatim -- /v2 is the platform's live public namespace,
    # and where infra ruled the downstream faces belong after /v1 was retired
    # wholesale on 2026-08-27.
    #
    # authResponseHeaders is what makes the three X-NextMoe-* headers
    # trustworthy: Traefik overwrites whatever the client sent with what oauth
    # answered.
    #
    # The explicit priority is not decoration. infra already runs a catch-all
    # `Host(api.nextmoe.dev) && PathPrefix(/v2)` router (infra-v2-pub), which is
    # what answers /v2/sticker/* today -- with its own 404 problem document.
    # Traefik's default priority is the rule's *length*, so ours wins only by
    # being 8 characters longer; one edit to infra's rule would silently take
    # the face back. 100 states the intent instead of inheriting it.
    #
    # Dokploy does not redeploy on a compose-only change. Click Deploy.
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.sticker-face-pub.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v2/sticker`)
      traefik.http.routers.sticker-face-pub.priority: '100'
      traefik.http.routers.sticker-face-pub.entrypoints: websecure
      traefik.http.routers.sticker-face-pub.tls.certresolver: letsencrypt
      traefik.http.routers.sticker-face-pub.middlewares: sticker-face-forwardauth
      traefik.http.routers.sticker-face-pub.service: sticker-face-pub
      traefik.http.routers.sticker-face-pub-http.rule: Host(`api.nextmoe.dev`) && PathPrefix(`/v2/sticker`)
      traefik.http.routers.sticker-face-pub-http.priority: '100'
      traefik.http.routers.sticker-face-pub-http.entrypoints: web
      traefik.http.routers.sticker-face-pub-http.middlewares: redirect-to-https@file
      traefik.http.routers.sticker-face-pub-http.service: sticker-face-pub
      traefik.http.middlewares.sticker-face-forwardauth.forwardauth.address: http://oauth:9277/internal/devapi/forward-auth?face=sticker
      traefik.http.middlewares.sticker-face-forwardauth.forwardauth.authResponseHeaders: X-NextMoe-Client-Id,X-NextMoe-Key-Id,X-NextMoe-Tier
      traefik.http.services.sticker-face-pub.loadbalancer.server.port: '9421'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', '/app', 'healthcheck']
      <<: *svc-health
    restart: unless-stopped

  web:
    image: ghcr.io/kunmoe/sticker-web:latest
    pull_policy: always
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      NITRO_PORT: '3000'
      NUXT_API_BASE_URL: http://sticker-api:9421
      NUXT_PUBLIC_API_BASE_URL: https://sticker.kungal.com
      NUXT_PUBLIC_SITE_URL: https://sticker.kungal.com
      NUXT_PUBLIC_OAUTH_SERVER_URL: https://account.nextmoe.com/api/v1
      NUXT_PUBLIC_OAUTH_FRONTEND_URL: https://account.nextmoe.com
      NUXT_PUBLIC_OAUTH_CLIENT_ID: c5cd7b074804ba134934eb6c175a8f4d
      NUXT_PUBLIC_OAUTH_REDIRECT_URI: https://sticker.kungal.com/auth/callback
      # Server-side only: the signature is computed in a Nitro route, so this
      # never reaches a browser bundle.
      NUXT_OG_SITE_KEY: ${NUXT_OG_SITE_KEY:-}
    expose:
      - '3000'
    depends_on:
      sticker-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      <<: *svc-health
    restart: unless-stopped

  # Schema migrations — auto on every `up`, BEFORE sticker-api. NOT in a jobs
  # profile. pull_policy: always so each deploy gets the image that baked the
  # current SQL. No `command:` so the binary's default is `up` (and
  # `compose run --rm migrate -dir down` still works). WORKDIR / so the default
  # relative `migrations` path is /migrations (distroless otherwise homes in
  # /home/nonroot). Manual: docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    image: ghcr.io/kunmoe/sticker-migrate:latest
    pull_policy: always
    working_dir: /
    environment:
      <<: *api-env
    restart: 'no'

networks:
  default:
    name: dokploy-network
    external: true
